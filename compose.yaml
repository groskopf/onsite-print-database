services:
  postgres:
    build: .
    image: ghcr.io/groskopf/onsite-print-database:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    environment:
      POSTGRES_USER: onsite_print
      POSTGRES_DB: onsite_print
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onsite_print -d onsite_print"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres-data:
